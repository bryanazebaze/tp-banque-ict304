# Paramètres de connexion MySQL (Local par défaut, variables pour Render)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/banque_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${JDBC_DATABASE_USERNAME:root}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Gestion automatique de la base de données
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect